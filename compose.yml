services:
  portale:
    build: .
    image: omada-guest-portal:latest
    container_name: omada-guest-portal
    restart: unless-stopped
    # Facoltativo: senza .env la configurazione si fa dal wizard al primo avvio.
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/Rome
    ports:
      - "8097:8097"
    volumes:
      - data:/data

volumes:
  data:
    name: omada-guest-portal_data
